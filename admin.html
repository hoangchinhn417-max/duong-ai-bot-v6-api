<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VYRO PRO Hidden Admin</title>
<link rel="stylesheet" href="style.css?v=ACCESS_ADMIN_FINAL_1">
<style>
  body{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:18px}
  .admin-secret-card{width:min(420px,100%);padding:26px;border:1px solid rgba(50,140,255,.45);border-radius:24px;background:rgba(6,17,45,.92);box-shadow:0 0 42px rgba(0,180,255,.22)}
  .admin-secret-card img{display:block;width:150px;max-width:42vw;margin:0 auto 18px;border-radius:8px}
  .admin-secret-card h1{text-align:center;margin:0 0 8px;color:#eaf6ff}
  .admin-secret-card p{text-align:center;color:#8dbdfc;margin:0 0 20px}
  .admin-secret-card input{font-size:16px}
</style>
</head>
<body>
  <div class="glow a"></div><div class="glow b"></div><div class="grid-bg"></div>
  <div class="admin-secret-card">
    <img src="./assets/vyro-logo.jpeg" alt="VYRO">
    <h1>Admin Ẩn</h1>
    <p>Nhập pass admin để vào bảng quản trị.</p>
    <div class="input-wrap"><span>🔐</span><input id="adminPass" type="password" placeholder="Nhập pass admin" onkeydown="if(event.key==='Enter')adminEnter()"></div>
    <button class="primary full" onclick="adminEnter()">Vào Admin</button>
    <small id="adminMsg" style="display:block;text-align:center;color:#ff8fa3;margin-top:12px"></small>
  </div>
<script>
const ADMIN_PASSES = ['pass-admin-cua-anh','2606','ADMIN-2606'];
function adminEnter(){
  const pass = document.getElementById('adminPass').value.trim();
  if(!ADMIN_PASSES.includes(pass)){
    document.getElementById('adminMsg').innerText='Sai pass admin';
    return;
  }
  localStorage.setItem('vyro_pro_session','admin');
  localStorage.setItem('vyro_pro_pin','2606');
  location.href='/?admin=1#admin';
}
</script>
</body>
</html>
